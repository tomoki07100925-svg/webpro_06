<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新幹線の列車登録</title>
</head>
<body>
  <h2>新幹線の列車を登録</h2>

  <form action="/train_types_add" method="get">
    <p>ID：<input type="number" name="id" required></p>

    <p>列車名：<input type="text" name="name" required></p>

    <p>特徴：<input type="text" name="feature" required></p>

    <input type="submit" value="登録">
  </form>
</body>
</html>
