<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>駅の登録</title>
</head>
<body>
  <h2>京葉線の駅を登録</h2>

  <form action="/keiyo_add" method="post">
    <p>ID：<input type="number" name="id" min="1" step="1" required></p>
    <p>駅コード：<input type="text" name="code" required></p>
    <p>駅名：<input type="text" name="name" required></p>
    <p>乗り換え線：<input type="text" name="change"></p>
    <p>乗客数：<input type="number" name="passengers" min="0" step="1"></p>
    <p>東京駅からの距離：<input type="number" name="distance" min="0" step="any"></p>

    <input type="submit" value="登録">
  </form>
  <a href="/keiyo2">駅一覧に戻る</a>
</body>
</html>
