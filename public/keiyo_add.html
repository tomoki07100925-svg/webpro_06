<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>駅の登録</title>
</head>
<body>
  <h2>京葉線の駅を登録</h2>

  <form action="/keiyo_add" method="get">
    <p>ID：<input type="number" name="id"></p>
    <p>駅コード：<input type="text" name="code"></p>
    <p>駅名：<input type="text" name="name"></p>

    <input type="submit" value="登録">
  </form>
</body>
</html>
